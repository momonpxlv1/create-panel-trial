<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Alur pembuatan panel: browser ke API Express, lalu ke Pterodactyl, dan disimpan di db.json">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:8 8;animation:dash 1.1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .node{animation:lift 6s ease-in-out infinite;transform-box:fill-box}
    .n2{animation-delay:1.5s}.n3{animation-delay:3s}.n4{animation-delay:4.5s}
    @keyframes lift{0%,100%{transform:translate(0,0)}8%{transform:translate(-3px,-3px)}16%{transform:translate(0,0)}}
    @media (prefers-reduced-motion:reduce){.flow,.node{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f0f0f"/></marker>
  </defs>
  <rect width="900" height="330" fill="#f7f6f1"/>
  <rect x="1.5" y="1.5" width="897" height="327" fill="none" stroke="#0f0f0f" stroke-width="3"/>

  <path id="p1" class="flow" d="M200 110 H330" fill="none" stroke="#0f0f0f" stroke-width="2" marker-end="url(#ah)"/>
  <path id="p2" class="flow" d="M530 110 H660" fill="none" stroke="#0f0f0f" stroke-width="2" marker-end="url(#ah)"/>
  <path id="p3" class="flow" d="M430 150 V212" fill="none" stroke="#2d5a3d" stroke-width="2" marker-end="url(#ah)"/>

  <circle r="5" fill="#2d5a3d"><animateMotion dur="3s" repeatCount="indefinite" path="M200 110 H330"/></circle>
  <circle r="5" fill="#2d5a3d"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M530 110 H660"/></circle>
  <circle r="5" fill="#2d5a3d"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M430 150 V212"/></circle>

  <g class="node n1">
    <rect x="46" y="76" width="160" height="68" fill="#0f0f0f"/>
    <rect x="40" y="70" width="160" height="68" fill="#ffffff" stroke="#0f0f0f" stroke-width="2"/>
    <text x="120" y="100" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f0f0f">Pengunjung</text>
    <text x="120" y="122" text-anchor="middle" class="mono" font-size="11" fill="#6b6b6b">React + Vite</text>
  </g>
  <g class="node n2">
    <rect x="336" y="76" width="200" height="68" fill="#0f0f0f"/>
    <rect x="330" y="70" width="200" height="68" fill="#e8f0ea" stroke="#0f0f0f" stroke-width="2"/>
    <text x="430" y="100" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f0f0f">API Express</text>
    <text x="430" y="122" text-anchor="middle" class="mono" font-size="11" fill="#2d5a3d">validasi + aturan akses</text>
  </g>
  <g class="node n3">
    <rect x="666" y="76" width="200" height="68" fill="#0f0f0f"/>
    <rect x="660" y="70" width="200" height="68" fill="#ffffff" stroke="#0f0f0f" stroke-width="2"/>
    <text x="760" y="100" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#0f0f0f">Pterodactyl</text>
    <text x="760" y="122" text-anchor="middle" class="mono" font-size="11" fill="#6b6b6b">Application API (PLTA)</text>
  </g>
  <g class="node n4">
    <rect x="336" y="218" width="200" height="52" fill="#0f0f0f"/>
    <rect x="330" y="212" width="200" height="52" fill="#ffffff" stroke="#0f0f0f" stroke-width="2"/>
    <text x="430" y="234" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f0f0f">db.json</text>
    <text x="430" y="252" text-anchor="middle" class="mono" font-size="11" fill="#6b6b6b">panel, log, riwayat IP</text>
  </g>

  <g class="mono" font-size="11" fill="#0f0f0f">
    <text x="265" y="98" text-anchor="middle">1 POST</text>
    <text x="595" y="98" text-anchor="middle">3 user, server</text>
    <text x="440" y="184" text-anchor="start">4 simpan</text>
  </g>
  <text x="430" y="62" text-anchor="middle" class="mono" font-size="11" fill="#2d5a3d">2 cek IP, nama, cooldown, egg</text>
  <g class="mono" font-size="11" fill="#6b6b6b">
    <text x="40" y="304">Kalau pembuatan server gagal, user yang sudah terbuat ikut dihapus lagi (rollback).</text>
  </g>
  <path d="M540 238 H640" stroke="#0f0f0f" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <text x="650" y="242" class="mono" font-size="11" fill="#6b6b6b">lalu broadcast sync (SSE)</text>
</svg>

